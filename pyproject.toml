[project]
name = "expense-tracker"
version = "0.1.0"
description = "A Flask-based expense tracker web application"
readme = "README.md"
authors = [
    { name = "Prathamesh", email = "prathamesh.gharat07@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"